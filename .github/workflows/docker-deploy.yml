name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "*.*.*"
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY_IMAGE: ${{ secrets.DOCKER_USERNAME }}/status-backend
  GHCR_IMAGE: statuscompliance/status-backend
  PR_ID: ${{ github.event.pull_request.number }}
  TAG: ${{ github.ref_name }}
  COMMIT_SHA: ${{ github.sha }}

jobs:
  #--- Job 1: Running all tests ---#
  test:
      runs-on: ubuntu-latest
      strategy:
        matrix:
          test-type: [unit, integration]
      
      steps:
        - name: Checkout ⬇️
          uses: actions/checkout@v4.2.2
          with:
            show-progress: false
            
        - name: Setup Node.js 🔧
          uses: actions/setup-node@v4
          with:
            node-version: '22'
            cache: 'npm'
            
        - name: Install dependencies 📦
          run: npm ci
          
        - name: Run ${{ matrix.test-type }} tests 🧪
          run: npm run test:${{ matrix.test-type }}
  
  # --- Job 2: Node Red API Tests ---
  node-red-test:
    needs: test
    runs-on: ubuntu-latest

    services:
      node-red:
        image: statuscompliance/node-red-status:latest
        ports:
          - 1880:1880
          
        env:
          NODE_RED_URL: http://localhost:1880
          NODE_RED_USER: admin
          NODE_RED_PASSWORD: admin
          TZ: Europe/Madrid

        options: >-
          --health-cmd "curl -f http://localhost:1880/auth/login || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout ⬇️
        uses: actions/checkout@v4.2.2
        with:
          show-progress: false
          
      - name: Setup Node.js 🔧
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install dependencies 📦
        run: npm ci
        
      - name: Run Node Red Tests 🧪
        run: npm run test:nodered 

  # --- Job 3: Coverage Report ---
  coverage:
    needs: test 
    runs-on: ubuntu-latest

    services:
      node-red:
        image: statuscompliance/node-red-status:latest
        ports:
          - 1880:1880
          
        env:
          NODE_RED_URL: http://localhost:1880
          NODE_RED_USER: admin
          NODE_RED_PASSWORD: admin
          TZ: Europe/Madrid

        options: >-
          --health-cmd "curl -f http://localhost:1880/auth/login || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          show-progress: false

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests with Coverage
        run: npm run coverage:ci

      - name: Submit Coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./coverage/lcov.info
  
  # --- Job 4: Build and Push Docker Image ---
  build:
    needs: coverage
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    
    steps:
      - name: Checkout ⬇️
        uses: actions/checkout@v4.2.2
        with:
          show-progress: false

      - name: Configure QEMU ⚙️
        uses: docker/setup-qemu-action@v3.6.0

      - name: Configure Docker Buildx ⚙️
        uses: docker/setup-buildx-action@v3.10.0

      - name: Login to DockerHub 🔑
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry 🔑
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ startsWith(github.ref, 'refs/tags/') && format('{0}:{1}', env.REGISTRY_IMAGE, env.TAG) || '' }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.REGISTRY_IMAGE) || '' }}
            ${{ github.ref == 'refs/heads/develop' && github.event_name == 'push' && format('{0}:develop', env.REGISTRY_IMAGE, env.COMMIT_SHA ) || '' }}
            ${{ github.event_name == 'pull_request' && format('{0}:PR.{1}', env.REGISTRY_IMAGE, env.PR_ID) || '' }}

      - name: Build and Push Ghcr Image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}:{1}', env.GHCR_IMAGE, env.TAG) || '' }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}:latest', env.GHCR_IMAGE) || '' }}
            ${{ github.ref == 'refs/heads/develop' && format('ghcr.io/{0}:develop', env.GHCR_IMAGE) || '' }}
            ${{ github.ref == 'refs/heads/develop' && github.event_name == 'push' && format('ghcr.io/{0}:develop', env.GHCR_IMAGE, env.COMMIT_SHA ) || '' }}
            ${{ github.event_name == 'pull_request' && format('ghcr.io/{0}:PR.{1}', env.GHCR_IMAGE, env.PR_ID) || '' }}