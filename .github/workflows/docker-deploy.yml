name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "*.*.*"
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY_IMAGE: ${{ secrets.DOCKER_USERNAME }}/status-backend
  GHCR_IMAGE: statuscompliance/status-backend
  PR_ID: ${{ github.event.pull_request.number }}
  TAG: ${{ github.ref_name }}
  COMMIT_SHA: ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-type: [unit-config, unit-controllers, unit-db, unit-middleware, unit-utils, integration]
    
    steps:
      - name: Checkout ⬇️
        uses: actions/checkout@v6.0.1
        with:
          show-progress: false
          
      - name: Setup Node.js 🔧
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install dependencies 📦
        run: npm ci
        
      - name: Run ${{ matrix.test-type }} tests 🧪
        run: |
          TEST_TYPE=$(echo "${{ matrix.test-type }}" | sed 's/-/:/')
          npm run test:$TEST_TYPE

  coverage:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        coverage-type: [unit-config, unit-controllers, unit-db, unit-middleware, unit-utils, integration]

    #Define here your service list
    services:
      node-red:
        image: statuscompliance/node-red-status:latest
        ports:
          - 1880:1880
        env:
          NODE_RED_USER: admin
          NODE_RED_PASSWORD: admin
          TZ: Europe/Madrid
        options: >-
          --health-cmd "curl -f http://localhost:1880/auth/login || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          
    #GLOBAL JOB .ENV CONFIGURATION
    env:
      NODE_RED_HOST: node-red
      NODE_RED_PORT: 1880
      NODE_RED_USER: admin
      NODE_RED_PASSWORD: admin

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.1
        with:
          show-progress: false

      - name: Set Up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ${{ matrix.coverage-type }} Coverage 📊
        run: |
          COVERAGE_TYPE=$(echo "${{ matrix.coverage-type }}" | sed 's/-/:/')
          npm run coverage:$COVERAGE_TYPE

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.coverage-type }}
          path: coverage/lcov.info
          retention-days: 1

  merge-coverage:
    needs: coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.1
        with:
          show-progress: false

      - name: Download All Coverage Artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-*
          path: coverage-reports

      - name: Merge Coverage Reports
        run: |
          mkdir -p coverage
          find coverage-reports -name 'lcov.info' -exec cat {} \; > coverage/lcov.info

      - name: Submit Coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./coverage/lcov.info
      
  build:
    needs: merge-coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: statususer
          POSTGRES_PASSWORD: statuspass
          POSTGRES_DB: statusdb
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mongo-registry:
        image: mongo
        ports:
          - 5001:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: USER
          MONGO_INITDB_ROOT_PASSWORD: PASS
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      dragonfly:
        image: ghcr.io/dragonflydb/dragonfly:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli -h 127.0.0.1 ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout ⬇️
        uses: actions/checkout@v6.0.1
        with:
          show-progress: false

      - name: Set up Node.js 🔧
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies 📦
        run: npm ci
      
      - name: Set Environment Variables 🌍
        run: cp .env.example .env && echo "NODE_ENV=production" >> .env

      - name: Start the server 🚀
        run: npm start &
      
      - name: Check server is running 🏃
        run: curl -f http://localhost:3001 || exit 1
  
  push:
    needs: build
    runs-on: ubuntu-latest
    if: (github.event.pull_request && github.event.label.name == '🐳 Dockerize')  || (github.event_name == 'push' && github.event.label.name == '🐳 Dockerize') || github.event_name == 'push'

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    
    steps:
      - name: Checkout ⬇️
        uses: actions/checkout@v6.0.1
        with:
          show-progress: false

      - name: Configure QEMU ⚙️
        uses: docker/setup-qemu-action@v3.7.0

      - name: Configure Docker Buildx ⚙️
        uses: docker/setup-buildx-action@v3.12.0

      - name: Login to DockerHub 🔑
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry 🔑
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ startsWith(github.ref, 'refs/tags/') && format('{0}:{1}', env.REGISTRY_IMAGE, env.TAG) || '' }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.REGISTRY_IMAGE) || '' }}
            ${{ github.ref == 'refs/heads/develop' && github.event_name == 'push' && format('{0}:develop', env.REGISTRY_IMAGE, env.COMMIT_SHA ) || '' }}
            ${{ github.event_name == 'pull_request' && format('{0}:PR.{1}', env.REGISTRY_IMAGE, env.PR_ID) || '' }}

      - name: Build and Push Ghcr Image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}:{1}', env.GHCR_IMAGE, env.TAG) || '' }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}:latest', env.GHCR_IMAGE) || '' }}
            ${{ github.ref == 'refs/heads/develop' && format('ghcr.io/{0}:develop', env.GHCR_IMAGE) || '' }}
            ${{ github.ref == 'refs/heads/develop' && github.event_name == 'push' && format('ghcr.io/{0}:develop', env.GHCR_IMAGE, env.COMMIT_SHA ) || '' }}
            ${{ github.event_name == 'pull_request' && format('ghcr.io/{0}:PR.{1}', env.GHCR_IMAGE, env.PR_ID) || '' }}